<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="img/app/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/app/apple-180.png">
<meta name="theme-color" content="#0a0707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WBSQUETE">
<title>Painel WBSQUETE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Layout: o painel é a Revista do Loydão virada app — faixa preta com cinturão no topo, chão vermelho pontilhado, cards pretos de borda grossa, amarelo só para quem está ganhando. Navegação embaixo, como o app da ESPN. */
:root{
  --chao:#d4121c; --chao-ponto:rgba(0,0,0,.18);
  --tinta:#0d0b0b; --card:#120c0c; --card2:#1b0002; --linha:#2c1f1f;
  --papel:#fff8ec; --texto:#f6efe4; --apagado:#b8a99a;
  --ouro:#e8c066; --amarelo:#ffd400; --vermelho:#d4121c; --verde:#22c55e; --perigo:#ff4a4a; --cinza:#8d8580;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --ui:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--tinta)}
body{color:var(--texto);font-family:var(--ui);font-size:15px;line-height:1.35;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#000}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#000;border-bottom:4px solid var(--ouro)}
.topo-in{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
.topo img.belt{height:44px;width:auto;flex:none}
.mast{font-family:var(--display);font-size:clamp(22px,5.4vw,34px);line-height:1;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff3c4 0%,#f1cf6a 45%,#b98a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.mast-sub{font-size:12px;color:var(--apagado);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .meio{min-width:0;flex:1}
.btn-atualiza{flex:none;background:transparent;border:1px solid rgba(232,192,102,.45);color:var(--ouro);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
.nav-top{display:none}

/* chão */
main{position:relative;min-height:70vh;background:var(--chao);padding-bottom:16px}
main::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--chao-ponto) 2px,transparent 2.4px);background-size:14px 14px;pointer-events:none}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.sobre{align-self:flex-start;background:#000;color:var(--amarelo);font-family:var(--display);font-size:18px;letter-spacing:.02em;padding:3px 12px;transform:rotate(-1.2deg)}
.manchete{font-family:var(--display);color:var(--amarelo);font-size:clamp(34px,8vw,56px);line-height:.98;margin:0;
  -webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:5px 5px 0 #000;text-wrap:balance}
.linha-fina{color:#fff;font-weight:700;font-size:16px;text-shadow:1px 1px 0 #000;margin:0;max-width:70ch}
.cab-secao{display:flex;flex-direction:column;gap:6px}

/* cards */
.card{background:var(--card);border:3px solid #000;box-shadow:5px 5px 0 #000;color:var(--texto)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
@media (max-width:420px){.grade{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.jogo .lado,.jogo .lado.dir{flex-direction:column;text-align:center;gap:4px}.lado .nm{font-size:18px}.duelo .placar{font-size:40px}.duelo .rosto{width:62px;height:62px}}

.rosto{position:relative;flex:none;width:52px;height:52px}
.rosto img.m{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--ouro);background:#2a1f1f;display:block}
.rosto img.l{position:absolute;right:-6px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #000;object-fit:contain}
.ini{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#2a1f1f;border:3px solid var(--cinza);font-family:var(--display);font-size:18px;color:var(--apagado)}

/* confronto (lista) */
.jogo{display:flex;flex-direction:column;gap:10px;padding:12px;cursor:pointer;text-align:left;width:100%;transition:transform .12s}
.jogo:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
.jogo-topo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.lado{display:flex;align-items:center;gap:10px;min-width:0}
.lado.dir{flex-direction:row-reverse;text-align:right}
.lado .nm{font-family:var(--display);font-size:20px;line-height:1.05;overflow-wrap:anywhere}
.lado .mg{font-size:12px;color:var(--apagado)}
.lado .info{min-width:0}
.placar{font-family:var(--display);font-size:34px;line-height:1;text-align:center;white-space:nowrap}
.placar .v{color:var(--amarelo)}
.placar small{display:block;font-family:var(--ui);font-size:11px;color:var(--apagado);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.chips{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
.chip{font-size:11px;font-weight:700;text-align:center;padding:3px 0;border:1px solid #000;letter-spacing:.02em}
.chip.a{background:var(--amarelo);color:#000}
.chip.b{background:var(--card2);color:#ffb3b3}
.chip.e{background:#4a4440;color:#eee}
.chip.peg{outline:2px dashed #fff;outline-offset:-3px}
.jogo-pe{display:flex;justify-content:space-between;font-size:12px;color:var(--apagado);gap:8px}
.jogo-pe b{color:var(--texto)}

/* detalhe */
.voltar{align-self:flex-start;background:#000;color:var(--amarelo);border:2px solid var(--amarelo);padding:6px 14px;font-weight:700;cursor:pointer}
.duelo{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.duelo .lado{flex-direction:column;text-align:center;gap:6px}.duelo .rosto{width:76px;height:76px}
.duelo .rosto img.l{width:34px;height:34px}
.duelo .nm{font-size:24px}
.duelo .placar{font-size:52px}
.cats{width:100%;border-collapse:collapse}
.cats td,.cats th{padding:9px 8px;border-bottom:1px solid var(--linha);font-variant-numeric:tabular-nums}
.cats th{font-size:11px;letter-spacing:.08em;color:var(--apagado);text-transform:uppercase;font-weight:700}
.cats .va,.cats .vb{font-family:var(--display);font-size:22px;width:28%}
.cats .va{text-align:right}.cats .vb{text-align:left}
.cats .cn{text-align:center;font-weight:700;font-size:13px;letter-spacing:.05em;width:18%}
.cats td.ganha{color:#000;background:var(--amarelo)}
.cats .pj{font-size:12px;color:var(--apagado);text-align:center;width:13%}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border:1px solid currentColor;text-transform:uppercase;vertical-align:middle}
.tag.peg{color:#fff;background:#000}
.tag.ok{color:var(--verde)}
.tag.ir{color:var(--cinza)}
.tag.out{color:#fff;background:var(--perigo);border-color:var(--perigo)}
.tag.dtd{color:#000;background:#ffb020;border-color:#ffb020}
.tag.hoje{color:#000;background:var(--amarelo);border-color:var(--amarelo)}
.tag.banco{color:#fff;background:#6b1010;border-color:#6b1010}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.duas{grid-template-columns:minmax(0,1fr)}}
.bloco-tit{font-family:var(--display);font-size:20px;padding:10px 12px;border-bottom:3px solid #000;background:#000;color:var(--amarelo);display:flex;justify-content:space-between;align-items:center;gap:8px}
.bloco-tit small{font-family:var(--ui);font-size:12px;color:var(--apagado);letter-spacing:.04em}

/* abas de dia */
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dia{flex:none;background:#000;color:#fff;border:2px solid #000;padding:6px 10px;font-weight:700;cursor:pointer;font-size:13px;line-height:1.1;text-align:center}
.dia small{display:block;font-size:10px;color:var(--apagado);font-weight:600}
.dia[aria-pressed="true"]{background:var(--amarelo);color:#000}
.dia[aria-pressed="true"] small{color:#000}
.dia:disabled{opacity:.4;cursor:default}

/* box de jogadores */
.box{display:flex;flex-direction:column}
.jog{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--linha)}
.jog:last-child{border-bottom:0}
.jog .ft{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:top;background:#e9e1d6;border:2px solid #000}
.jog .ft.ini{font-size:15px;color:#3a2a2a;background:#e9e1d6;border:2px solid #000}
.jog .nm{font-weight:700;font-size:15px;line-height:1.15;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.jog .sub{font-size:12px;color:var(--apagado)}
.jog .lin{font-size:12.5px;color:#e9dfd2;font-variant-numeric:tabular-nums}
.jog .pts{font-family:var(--display);font-size:24px;text-align:right;line-height:1}
.jog .pts small{display:block;font-family:var(--ui);font-size:10px;color:var(--apagado);letter-spacing:.06em}
.jog.fora{background:repeating-linear-gradient(-45deg,#1a0f0f 0 8px,#160c0c 8px 16px)}
.jog.fora .pts{color:#ff8a8a}
.jog.zero{opacity:.55}
.sep{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado);padding:8px 12px 4px;background:#0a0707}
.vazio{padding:16px 12px;color:var(--apagado)}

/* elencos */
.times{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px}
.tbtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;background:#000;border:3px solid #000;padding:6px 6px 4px;cursor:pointer;width:72px}
.tbtn img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#2a1f1f}
.tbtn span{font-size:11px;font-weight:700;white-space:nowrap}
.tbtn[aria-pressed="true"]{border-color:var(--amarelo);background:var(--card2)}
.alertas{display:flex;flex-direction:column;gap:8px}
.alerta{display:flex;gap:10px;align-items:flex-start;background:#000;border:3px solid var(--amarelo);padding:10px 12px;font-weight:600}
.alerta b{color:var(--amarelo);font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em;flex:none}
.tabela-wrap{overflow-x:auto}
.ros{width:100%;border-collapse:collapse;min-width:720px}
.ros th{font-size:11px;letter-spacing:.08em;color:var(--apagado);text-transform:uppercase;text-align:right;padding:8px 6px;border-bottom:2px solid #000;background:#0a0707;position:sticky;top:0}
.ros th:first-child,.ros td:first-child{text-align:left}
.ros td{padding:7px 6px;border-bottom:1px solid var(--linha);text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.ros td.qm{display:flex;gap:10px;align-items:center;min-width:220px}
.ros td.qm img,.ros td.qm .ini{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top;background:#e9e1d6;border:2px solid #000;flex:none;font-size:13px;color:#3a2a2a}
.ros tr.grupo td{background:#0a0707;color:var(--apagado);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left}
.ros .bom{color:var(--amarelo);font-weight:700}

/* matriz */
.mx{border-collapse:separate;border-spacing:3px;margin:0 auto}
.mx td,.mx th{width:52px;height:40px;text-align:center;font-family:var(--display);font-size:16px;padding:0}
.mx th img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #000;background:#2a1f1f;display:block;margin:0 auto}
.mx th.lin{width:auto;text-align:left;padding-right:6px;white-space:nowrap}
.mx th.lin span{display:inline-flex;align-items:center;gap:6px;font-size:15px}
.mx th.lin small{font-family:var(--ui);font-size:11px;color:var(--amarelo)}
.mx td.w{background:var(--amarelo);color:#000}
.mx td.l{background:#4a0006;color:#ffb3b3}
.mx td.t{background:#8d8580;color:#000}
.mx td.x{background:#000;color:#555}

/* transações */
.tx{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:10px 12px;border-bottom:1px solid var(--linha);align-items:start}
.tx:last-child{border-bottom:0}
.tx .q{font-size:12px;color:var(--apagado)}
.tx .mov{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mv{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border:2px solid #000;font-weight:700;font-size:13px}
.mv img,.mv .ini{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:top;background:#e9e1d6;border:0;font-size:10px;color:#3a2a2a}
.mv.add{background:#0f2a15;color:#9ff0b4}
.mv.drop{background:#2a0b0b;color:#ff9c9c}
.mv.trade{background:#2a240b;color:var(--amarelo)}

/* museu */
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtros select{background:#000;color:#fff;border:2px solid var(--amarelo);padding:7px 10px;font:inherit;font-weight:700}
.filtros label{font-weight:700;color:#fff;text-shadow:1px 1px 0 #000}
.pilulas{display:flex;flex-wrap:wrap;gap:6px}
.pil{background:#000;color:#fff;border:2px solid #000;padding:6px 12px;font-weight:700;cursor:pointer;font-size:13px}
.pil[aria-pressed="true"]{background:var(--amarelo);color:#000}
.mj{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--linha);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.mj:hover{background:#1d1212}
.mj .qd{font-size:12px;color:var(--apagado);white-space:nowrap}
.mj .q{font-weight:700;font-size:15px;min-width:0}
.mj .q .w{color:var(--amarelo)}
.mj .rs{font-family:var(--display);font-size:22px;white-space:nowrap}
.selo{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 6px;margin-left:6px;text-transform:uppercase;vertical-align:middle;background:var(--amarelo);color:#000}
.selo.esc{background:#fff}
.h2h{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:14px;gap:10px}
.h2h .big{font-family:var(--display);font-size:46px;line-height:1;text-align:center}
.h2h .big small{display:block;font-family:var(--ui);font-size:12px;color:var(--apagado)}

/* atualizar */
.cola{display:flex;flex-direction:column;gap:10px;padding:14px}
.cola textarea{width:100%;min-height:120px;background:#000;color:#ddd;border:2px solid var(--amarelo);font:12px ui-monospace,Menlo,monospace;padding:8px}
.cola .acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--amarelo);color:#000;border:3px solid #000;padding:9px 16px;font-family:var(--display);font-size:18px;letter-spacing:.02em;cursor:pointer;box-shadow:3px 3px 0 #000}
.btn.sec{background:#000;color:var(--amarelo);border-color:var(--amarelo)}
.msg{font-weight:700}
.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* rodapé + nav */
.rod{display:flex;align-items:center;gap:14px;background:#000;border-top:4px solid var(--ouro);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.rod img{width:54px;height:54px;border-radius:50%;border:3px solid var(--ouro)}
.rod p{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:700;color:var(--ouro);font-size:18px}
.rod small{display:block;font-family:var(--ui);color:var(--apagado);font-weight:500;font-size:12px}
main+.rod{margin-top:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#000;border-top:3px solid var(--ouro);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--apagado);text-decoration:none;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.nav a[aria-current="page"]{color:var(--amarelo)}
.nav a[aria-current="page"] svg{stroke:var(--amarelo)}
@media (min-width:900px){
  .nav{display:none}
  .nav-top{display:flex;gap:4px}
  .nav-top a{color:var(--apagado);text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border:2px solid transparent}
  .nav-top a[aria-current="page"]{color:#000;background:var(--amarelo);border-color:#000}
  main{padding-bottom:0}
  .rod{padding-bottom:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- ficha do confronto (papel creme, cores dos times) ---------- */
.ficha{--fa:#b01030;--fb:#1e3a8a;--papel:#f6f1e3;--tinta-p:#1d1b18;--linha-p:#d9d0bb;--apag-p:#6f675a;
  background:var(--papel);color:var(--tinta-p);border:3px solid #000;box-shadow:6px 6px 0 #000;display:flex;flex-direction:column;gap:18px;padding:16px 16px 20px}
.ficha-topo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.ficha-info{font-size:12px;color:var(--apag-p);line-height:1.5}
.ficha-info b{color:var(--tinta-p)}
.marcador{display:flex;align-items:center;gap:8px;justify-content:center}
.marcador img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid #000}
.pill{font-family:var(--display);font-size:clamp(22px,5vw,34px);color:#fff;padding:2px 12px 4px;border-radius:12px;line-height:1.1;letter-spacing:.02em}
.pill.a{background:var(--fa)}.pill.b{background:var(--fb)}
.marcador .pl{font-family:var(--display);font-size:clamp(28px,7vw,46px);line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.ficha-mgr{display:flex;justify-content:space-between;font-size:12px;color:var(--apag-p);gap:8px;margin-top:-8px}
.ficha-mgr a{color:inherit;font-weight:700;text-decoration:none;border-bottom:1px dotted currentColor}
.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.odd{border:2px solid var(--tinta-p);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:#fffdf6}
.odd .q{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--apag-p);font-weight:700}
.odd .v{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.odd .p{font-size:12px;color:var(--apag-p);font-variant-numeric:tabular-nums}
.odd.a{border-color:var(--fa)}.odd.a .v{color:var(--fa)}
.odd.b{border-color:var(--fb)}.odd.b .v{color:var(--fb)}
.ficha h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ficha h3 small{font-family:var(--ui);font-size:12px;color:var(--apag-p);letter-spacing:0}
.graf svg{width:100%;height:auto;display:block}
.crow{display:grid;grid-template-columns:auto 76px minmax(0,1fr) 76px auto;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--linha-p)}

.vbox{border:2px solid currentColor;border-radius:9px;text-align:center;font-weight:700;padding:3px 0;font-variant-numeric:tabular-nums;font-size:15px}

.vbox.ganha.a{background:var(--fa);color:#fff;border-color:var(--fa)}
.vbox.ganha.b{background:var(--fb);color:#fff;border-color:var(--fb)}
.cnome{text-align:center;font-family:var(--display);font-size:17px;letter-spacing:.04em;line-height:1}
.cnome small{display:block;font-family:var(--ui);font-size:11px;color:var(--apag-p);letter-spacing:0;margin-top:3px;font-variant-numeric:tabular-nums}
@media (max-width:460px){.crow{grid-template-columns:auto 62px minmax(0,1fr) 62px auto;gap:5px}.estr{font-size:12px;letter-spacing:0}.vbox{font-size:13px}}
.mapa{overflow-x:auto}
.mapa table{border-collapse:separate;border-spacing:4px;margin:0 auto}
.mapa td{min-width:52px;height:44px;text-align:center;border-radius:8px;font-size:12px;line-height:1.15;font-variant-numeric:tabular-nums}

.dupla{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.dupla{grid-template-columns:minmax(0,1fr)}}
.mini{display:flex;flex-direction:column}
.mini .j{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--linha-p)}
.mini .j:last-child{border-bottom:0}
.mini .j img,.mini .j .ini{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;background:#e9e1d6;border:2px solid var(--tinta-p);font-size:11px;color:#3a2a2a}
.mini .j .n{font-weight:700;font-size:14px;line-height:1.15}
.mini .j .s{font-size:11.5px;color:var(--apag-p)}
.mini .j .r{font-family:var(--display);font-size:20px;text-align:right;line-height:1}
.mini .j .r small{display:block;font-family:var(--ui);font-size:10px;color:var(--apag-p)}
.mini .tit{font-weight:700;font-size:13px;padding:4px 0;border-bottom:2px solid currentColor}
.forma{display:flex;gap:4px;flex-wrap:wrap}
.fm{display:inline-flex;flex-direction:column;align-items:center;min-width:44px;padding:4px 6px;border-radius:8px;font-weight:700;font-size:12px;line-height:1.1;font-variant-numeric:tabular-nums}
.fm small{font-size:10px;font-weight:600;opacity:.8}
.fm.v{background:#1f8a4c;color:#fff}.fm.d{background:#b3261e;color:#fff}.fm.e{background:#8d8580;color:#fff}.fm.ao{background:#fff;color:#000;border:2px dashed #000}
.h2hlista{display:flex;flex-direction:column}
.h2hlista button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 2px;border:0;border-bottom:1px solid var(--linha-p);background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit}
.h2hlista button:hover{background:rgba(0,0,0,.05)}
.h2hlista .qd{font-size:12px;color:var(--apag-p);white-space:nowrap}
.h2hlista .rs{font-family:var(--display);font-size:20px}
.h2hlista .w{font-weight:700;text-decoration:underline;text-decoration-thickness:2px}

/* home: odds no card */
.oddbar{display:flex;height:8px;border:1px solid #000;overflow:hidden}
.oddbar span{display:block;height:100%}
.oddtxt{display:flex;justify-content:space-between;font-size:12px;color:var(--apagado);font-variant-numeric:tabular-nums}
.oddtxt b{color:var(--texto)}

/* times */
.tcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;cursor:pointer;text-align:left;width:100%}
.tcard .nm{font-family:var(--display);font-size:22px;line-height:1}
.tcard .mg{font-size:12px;color:var(--apagado)}
.tcard .rec{font-family:var(--display);font-size:26px;text-align:right;line-height:1}
.tcard .rec small{display:block;font-family:var(--ui);font-size:11px;color:var(--apagado)}
.taca{color:var(--amarelo)}
.thero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px}
.thero .rosto{width:96px;height:96px}
.thero .rosto img.l{width:40px;height:40px}
.thero .nm{font-family:var(--display);font-size:clamp(30px,7vw,44px);line-height:1}
.thero .dados{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.thero .dados div{font-size:12px;color:var(--apagado);text-transform:uppercase;letter-spacing:.06em}
.thero .dados b{display:block;font-family:var(--display);font-size:22px;color:var(--texto);letter-spacing:0;font-weight:400}
.sofa{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:12px}
.sf{background:#1d1414;border:2px solid #000;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.sf:hover{border-color:var(--amarelo)}
.sf .qd{display:flex;justify-content:space-between;font-size:11px;color:var(--apagado)}
.sf .qd b{color:#000;padding:0 6px;border-radius:4px}
.sf .ln{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.sf .ln div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;text-align:center}
.sf .ln img,.sf .ln .ini{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#2a1f1f;border:2px solid #000;font-size:13px}
.sf .ln .pl{font-family:var(--display);font-size:24px}
.t2{width:100%;border-collapse:collapse}
.t2 th{font-size:11px;letter-spacing:.08em;color:var(--apagado);text-transform:uppercase;text-align:right;padding:8px 8px;border-bottom:2px solid #000;background:#0a0707}
.t2 td{padding:8px;border-bottom:1px solid var(--linha);text-align:right;font-variant-numeric:tabular-nums}
.t2 th:first-child,.t2 td:first-child{text-align:left}
.t2 td .lg{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.t2 td .lg img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#2a1f1f;border:2px solid #000}
.t2 tr.top td{background:#2a2306}
.t2 .ouro{color:var(--amarelo);font-weight:700}

/* tabelão */
.ros th button{all:unset;cursor:pointer}
.ros th button[aria-sort]{color:var(--amarelo)}
.ros td .tl{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#2a1f1f;border:1px solid #000;vertical-align:middle}
.nota{font-family:var(--display);font-size:18px}
.nota.pos{color:var(--amarelo)}.nota.neg{color:#ff8a8a}

/* campeões */
.camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cp{background:#000;border:3px solid var(--ouro);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:4px 4px 0 #000}
.cp .ano{font-family:var(--display);font-size:30px;color:var(--amarelo);line-height:1}
.cp .rosto{width:72px;height:72px}
.cp .nm{font-weight:700}
.cp .mg{font-size:12px;color:var(--apagado)}
.perf{display:grid;grid-template-columns:28px 48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--linha)}
.perf .pos{font-family:var(--display);font-size:20px;color:var(--apagado);text-align:center}
.perf img.ft,.perf .ft.ini{width:48px;height:48px}
.perf .big{font-family:var(--display);font-size:30px;color:var(--amarelo);line-height:1;text-align:right}
.perf .big small{display:block;font-family:var(--ui);font-size:10px;color:var(--apagado);letter-spacing:.06em}
.ao-vivo{display:inline-flex;align-items:center;gap:6px}
.ao-vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff4a4a;box-shadow:0 0 0 3px rgba(255,74,74,.3)}


/* ---------- v3: confronto no layout da revista ---------- */
.placar-topo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:14px 12px;background:#000;border-bottom:3px solid var(--ouro)}
.placar-topo .lado{flex-direction:column;text-align:center;gap:6px}
.placar-topo .lado .nm{font-size:22px}
.placar-topo .rosto{width:70px;height:70px}
.placar-topo .pl{font-family:var(--display);font-size:clamp(40px,10vw,64px);line-height:1;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.placar-topo .pl .v{color:var(--amarelo)}
.placar-topo .pl small{display:block;font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado);margin-top:6px}
.tabcat{width:100%;border-collapse:collapse;table-layout:fixed}
.tabcat col.c1{width:24%}.tabcat col.c2{width:17%}.tabcat col.c3{width:18%}
.tabcat th .tip{color:#7fc8ff}
.tabcat th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado);padding:8px 4px;border-bottom:2px solid #000;background:#0a0707;font-weight:700}
.tabcat td{padding:0;border-bottom:2px solid #000;height:50px;vertical-align:middle;text-align:center;font-variant-numeric:tabular-nums}
.tabcat .v{font-family:var(--display);font-size:24px;line-height:1;color:var(--texto)}
.tabcat td.g{background:var(--amarelo)}
.tabcat td.g .v{color:#000}
.tabcat .pv{font-family:var(--display);font-size:22px;line-height:1;color:#7fc8ff}
.tabcat td.g+.pvc,.tabcat .pvc{color:var(--apagado)}
.tabcat .cn{font-family:var(--display);font-size:16px;letter-spacing:.04em;color:var(--amarelo)}
.tabcat .cn small{display:block;font-family:var(--ui);font-size:10px;letter-spacing:.06em;color:#fff;background:var(--vermelho);padding:1px 5px;margin:3px auto 0;width:max-content;border:1px solid #000}
.tabcat .cn small.vira{background:#000;color:var(--amarelo);border-color:var(--amarelo)}
.tabcat th.lg img{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#fff;border:2px solid #000}
.tabcat tr.resumo td{height:auto;padding:8px 4px;font-size:12px;color:var(--apagado);border-bottom:0;background:#0a0707}
.tabcat tr.resumo b{color:var(--texto)}
@media (max-width:420px){.tabcat .v{font-size:19px}.tabcat .cn{font-size:14px}.tabcat .pv{font-size:17px}}

/* BetLoyde */
.bet{background:#000;border:3px solid var(--amarelo);box-shadow:5px 5px 0 #000;padding:12px}
.bet .marca{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bet .logo{font-family:var(--display);font-size:26px;letter-spacing:.02em;line-height:1;color:#fff}
.bet .logo b{color:var(--amarelo);font-weight:400}
.bet .logo i{display:inline-block;font-style:normal;background:var(--vermelho);color:#fff;font-size:11px;letter-spacing:.1em;padding:2px 6px;margin-left:8px;vertical-align:middle;transform:rotate(-3deg)}
.bet .marca small{font-size:11px;color:var(--apagado);letter-spacing:.06em;text-transform:uppercase;text-align:right}
.bet .quad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bet .q{background:var(--amarelo);color:#000;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.bet .q.x{background:#fff}
.bet .q .k{font-family:var(--display);font-size:30px;line-height:1}
.bet .q .o{font-family:var(--display);font-size:36px;line-height:1;margin-top:4px}
.bet .q .n{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bet .q.fav{outline:3px solid #fff;outline-offset:-6px}
.bet .pe{margin-top:10px;font-size:12px;color:var(--apagado);text-align:center}

/* chances de placar em barras */
.chances{display:flex;flex-direction:column;gap:6px;padding:12px}
.ch{display:grid;grid-template-columns:70px minmax(0,1fr) 56px;gap:10px;align-items:center}
.ch .s{font-family:var(--display);font-size:22px;line-height:1;text-align:right;white-space:nowrap}
.ch .bar{height:22px;background:#2a1f1f;border:2px solid #000;position:relative;overflow:hidden}
.ch .bar span{position:absolute;inset:0 auto 0 0;background:var(--amarelo)}
.ch .bar span.b{background:#8d8580}
.ch .bar span.e{background:#555}
.ch .p{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.ch.top .s{color:var(--amarelo)}
.ch .quem{font-size:11px;color:var(--apagado);display:block;font-family:var(--ui);letter-spacing:.04em;text-transform:uppercase}

/* leitura do Loydão */
.leitura{padding:4px 12px 12px}
.leitura ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.leitura li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--linha);align-items:start;font-size:15px;line-height:1.35}
.leitura li:last-child{border-bottom:0}
.leitura .ico{font-family:var(--display);font-size:12px;letter-spacing:.08em;background:var(--amarelo);color:#000;padding:3px 6px;margin-top:2px;white-space:nowrap;border:2px solid #000}
.leitura .ico.r{background:var(--vermelho);color:#fff}
.leitura .ico.c{background:#fff}
.leitura b{color:var(--amarelo)}
.leitura .fa{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.leitura .fa .mv{background:#0f2a15;color:#9ff0b4}

/* quadro do confronto (revista) */
.quadro{background:#000;border:3px solid var(--ouro);box-shadow:5px 5px 0 #000;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quadro div{display:flex;flex-direction:column;gap:3px;min-width:0}
.quadro .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ouro);font-weight:700}
.quadro .vv{font-family:var(--display);font-size:22px;line-height:1.05;color:#fff;overflow-wrap:anywhere}
.quadro .vv small{display:block;font-family:var(--ui);font-size:11px;color:var(--apagado)}
@media (max-width:460px){.quadro{grid-template-columns:minmax(0,1fr)}}
.hist-lista{display:flex;flex-direction:column}
.hist-lista button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border:0;border-bottom:1px solid var(--linha);background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit}
.hist-lista button:last-child{border-bottom:0}
.hist-lista button:not(:disabled):hover{background:#1d1212}
.hist-lista .qd{font-size:12px;color:var(--apagado);white-space:nowrap}
.hist-lista .rs{font-family:var(--display);font-size:20px}
.hist-lista .w{color:var(--amarelo);font-weight:700}

/* ranking do Loydão */
.rk{width:100%;border-collapse:collapse;min-width:860px}
.rk th{font-size:11px;letter-spacing:.08em;color:var(--apagado);text-transform:uppercase;text-align:right;padding:9px 8px;border-bottom:2px solid #000;background:#0a0707;white-space:nowrap}
.rk th button{all:unset;cursor:pointer}
.rk th button[aria-sort]{color:var(--amarelo)}
.rk td{padding:8px;border-bottom:1px solid var(--linha);text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.rk th:nth-child(-n+3),.rk td:nth-child(-n+3){text-align:left}
.rk tr{cursor:pointer}
.rk tr:hover td{background:#1d1212}
.rk .pos{font-family:var(--display);font-size:24px;color:var(--amarelo);width:36px}
.rk .mov{font-size:12px;font-weight:700;width:34px}
.rk .mov.up{color:var(--verde)}.rk .mov.dn{color:var(--perigo)}.rk .mov.eq{color:var(--cinza)}
.rk .tm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-width:150px}
.rk .tm img{width:34px;height:34px;border-radius:50%;object-fit:contain;background:#fff;border:2px solid #000;flex:none}
.rk .tm small{display:block;font-weight:500;color:var(--apagado);font-size:11px}
.rk .rt{font-family:var(--display);font-size:22px}
.rk .pb{position:relative;display:inline-block;width:64px;height:16px;background:#2a1f1f;border:1px solid #000;vertical-align:middle;margin-left:6px}
.rk .pb span{position:absolute;inset:0 auto 0 0;background:var(--amarelo)}
.rk .pb span.r{background:var(--perigo)}
.rk tr.corte td{border-bottom:3px dashed var(--ouro)}
.forma3{display:inline-flex;gap:3px}
.forma3 i{display:inline-block;width:14px;height:14px;border:1px solid #000;font-style:normal}
.forma3 .v{background:var(--verde)}.forma3 .d{background:var(--perigo)}.forma3 .e{background:var(--cinza)}
.legenda{font-size:12px;color:var(--apagado);padding:8px 12px;line-height:1.4}

/* radar */
.radar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;align-items:start}
.rd{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--linha)}
.rd:last-child{border-bottom:0}
.rd .n{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rd .s{font-size:12px;color:var(--apagado)}
.rd .s b{color:var(--texto)}
.rd .q{font-size:13px;color:#e9dfd2;font-style:italic;margin-top:2px}
.rd .d{font-family:var(--display);font-size:24px;text-align:right;line-height:1}
.rd .d small{display:block;font-family:var(--ui);font-size:10px;color:var(--apagado);letter-spacing:.06em}
.rd .d.up{color:var(--verde)}.rd .d.dn{color:var(--perigo)}
.rd img.tl{width:18px;height:18px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #000;vertical-align:middle}
.selo.livre{background:var(--verde);color:#000}.selo.wv{background:#ffb020;color:#000}
.cab-radar{display:flex;flex-direction:column;gap:2px}
.cab-radar small{color:var(--apagado);font-size:12px}
.faixa{background:#000;color:var(--amarelo);font-family:var(--display);font-size:18px;padding:8px 14px;text-align:center;border:3px solid var(--amarelo);box-shadow:4px 4px 0 #000;letter-spacing:.02em}
.melhora{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.melhora img{width:22px;height:22px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #000}
.melhora span{font-size:11px;color:var(--apagado)}

/* tooltip */
.tip{position:relative;cursor:help;border-bottom:1px dotted currentColor;white-space:nowrap}
.tip i{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--amarelo);color:#000;font:700 10px/1 var(--ui);font-style:normal;margin-left:4px;vertical-align:2px}
.tip::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 8px);z-index:40;width:min(300px,80vw);background:#000;color:#fff;border:2px solid var(--amarelo);padding:8px 10px;font:500 13px/1.35 var(--ui);white-space:normal;letter-spacing:0;text-transform:none;box-shadow:4px 4px 0 #000;display:none;pointer-events:none}
.tip:hover::after,.tip:focus-visible::after,.tip.aberta::after{display:block}
.tip.dir::after{left:auto;right:0}
.linha-fina .tip,.legenda .tip{color:inherit}
td .tip::after,th .tip::after{left:50%;transform:translateX(-50%)}
/* ranking em cards */
.rkl{display:flex;flex-direction:column;gap:10px}
.rkc{display:grid;grid-template-columns:34px 30px 48px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:4px 10px;align-items:center;padding:10px 12px;text-align:left;width:100%;cursor:pointer;transition:transform .12s}
.rkc:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
.rkc .pos{font-family:var(--display);font-size:28px;color:var(--amarelo);grid-row:1/3;grid-column:1}
.rkc .mov{font-size:12px;font-weight:700;grid-row:1/3;grid-column:2}
.rkc .mov.up{color:var(--verde)}.rkc .mov.dn{color:var(--perigo)}.rkc .mov.eq{color:var(--cinza)}

/* barra do confronto: início + setas + placar mini, presa no topo */

.jn-home,.jogo-nav .jn-b{all:unset;cursor:pointer;flex:0 0 36px;height:34px;display:flex;align-items:center;justify-content:center;background:#000;color:var(--amarelo);border:2px solid var(--amarelo);border-radius:8px;font-size:20px;font-weight:800}
.jn-home{background:var(--amarelo);color:#000}
.jn-mini{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);color:#fff}

.jn-mini b{font-weight:400;font-size:15px;letter-spacing:.03em}.jn-mini span{font-size:22px;letter-spacing:.02em}.jn-mini em{font-style:normal}.jn-mini em.v{color:var(--amarelo)}
.jn-mini small{font:700 10px system-ui,sans-serif;color:var(--apagado);margin-left:4px}
/* botão de início das outras telas: chip pequeno, sem ocupar linha */
.barra-inicio{float:right;margin:2px 0 4px 8px;position:relative;z-index:2}
.barra-inicio .inicio{padding:4px 10px;font-size:13px;border-width:1.5px}
/* pílulas numa linha com rolagem (Ranking, Radar, Museu) */
.pilulas:not(.mini):not(.vis){flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.pilulas:not(.mini):not(.vis)::-webkit-scrollbar{display:none}
.pilulas:not(.mini):not(.vis)>.pil:not(.big){flex:0 0 auto;white-space:nowrap}
.pilulas:not(.mini):not(.vis)>select,.pilulas:not(.mini):not(.vis)>label{flex:0 0 auto}
@media (max-width:560px){
 .linha-fina{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

}

.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:6px;padding:10px}

b.neg{color:#ff6b6b}

.lei{margin-top:10px}.lei .lei-a{display:block;margin:0 0 4px}.lei-t{font-size:19px}.lei p{font-size:14px}

.tj-res{display:block;width:100%;font:600 10px system-ui,sans-serif;color:var(--apagado);margin-top:1px}

.pf-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.pf-c{display:flex;gap:10px;align-items:center;padding:10px 12px;text-decoration:none;color:inherit}.pf-c .rosto{width:54px;height:54px;flex:0 0 54px}
.pf-c b{display:block;font-family:var(--display);font-weight:400;font-size:20px}.pf-c small{display:block;color:var(--apagado);font-size:12px}.pf-c span{display:block;font-size:12px;color:#ddd;margin-top:2px}
.car-ft.tj{flex-wrap:nowrap;white-space:nowrap}.tj-res{display:inline;width:auto;margin:0 0 0 4px;white-space:nowrap}
/* carreira: linha limpa */
.car-l summary.cr{display:flex!important;flex-direction:column;gap:3px;padding:9px 12px}
.cr-1{display:flex;align-items:center;gap:8px;min-width:0}

.tr-t{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}.tr-t img,.tr-t .ini{width:20px;height:20px;border-radius:50%;border:1.5px solid #000;object-fit:cover;font-size:9px}

.tr-fa{font:800 9px system-ui;color:#000;background:#888;border-radius:3px;padding:1px 3px;flex:0 0 auto}.tr-livre{font:600 11px system-ui;color:var(--apagado)}

.car-l summary.cr{align-items:stretch!important;text-align:left!important;justify-content:flex-start!important}.cr-1{justify-content:flex-start}

.qq.mini{width:16px;height:16px;font-size:10px;border-width:1.5px;margin-left:4px}

.lei.jornal{background:#f4ead8;color:#141010;border:0;border-radius:2px;padding:10px 12px 12px;position:relative;box-shadow:3px 3px 0 #000;margin-top:10px;transform:rotate(-.4deg)}

.lei.jornal .lei-inj{color:#d4121c!important;font-size:12px!important;font-family:system-ui,sans-serif;font-weight:700}
/* carreira menor */
.cr-ano{font-size:15px}.cr-2{font-size:11px}.cr-2 .car-dr{font-size:10px}
.car-mais,.car-corte .car-mais{gap:2px}.car-mais div{padding:2px 1px}.car-mais b{font-size:12px}
.tr-det{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px;padding:4px 10px 6px}
.tr-n{display:inline-flex;flex-direction:column;align-items:center;gap:1px;width:40px}.tr-n img,.tr-n .ini{width:24px;height:24px;border-radius:50%;border:1.5px solid #000;object-fit:cover;font-size:10px}
.tr-n em{font:800 9px system-ui;color:#fff;font-style:normal}.tr-n small{font:600 8px system-ui;color:var(--apagado);text-transform:uppercase}

.car-sub{display:flex;align-items:center}

.bio{padding:10px 12px}.bio-ap{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.bio-ap span{background:var(--amarelo);color:#000;font:800 10px system-ui;padding:2px 7px;border-radius:10px}

/* ===== UX pass (benchmarks Sofascore/FotMob/Sleeper) ===== */
[data-pj],[data-pjn]{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .12s}
[data-pj]:active,[data-pjn]:active{background-color:rgba(255,212,0,.10)}
.tem-mais{-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
.tem-antes{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%);mask-image:linear-gradient(to right,transparent,#000 12%)}
.tem-mais.tem-antes{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 85%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 85%,transparent)}
@media (max-width:640px){
 #popFicha.pop-fundo{align-items:flex-end;padding:0}
 #popFicha .pop-full{width:100%;max-height:92vh;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));animation:sobe .22s ease-out}

function notas(lista,getAv,minG,pool){
  // z-score nas 9 categorias, FG e FT pelo impacto (acertos acima da média da liga x volume).
  // 1ª passada com todo mundo; 2ª recalcula médias e desvios só no top 156 (12 times x 13 vagas).
  minG=minG??2;pool=pool??156;
  const base=lista.filter(p=>getAv(p)&&getAv(p)[11]>=minG);if(base.length<5)return;
  const f1=notasPool(base,getAv);if(base.length<=pool)return f1;
  const top=base.map(p=>[p,f1(getAv(p)).n]).sort((x,y)=>y[1]-x[1]).slice(0,pool).map(x=>x[0]);
  return notasPool(top,getAv);
}
function notasPool(ps,getAv){

    return {n:zc.reduce((x,y)=>x+y,0)+zt+zf+zF,c:{PTS:zc[0],REB:zc[1],AST:zc[2],STL:zc[3],BLK:zc[4],"3PM":zc[5],TO:zt,"FG%":zf,"FT%":zF}}};
}

/* ---------- simulação do confronto ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(R){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
/* fatores de variância por stat (sd = f·√média), medidos nos boxes diários da liga desde 22/23 */
const FVAR={reb:1.09,ast:1.05,stl:1.0,blk:1.01,tp:1.04,to:0.98,fgm:1.07,fga:1.11,ftm:1.36,fta:1.43};
function jogoSim(av,out,R,pdnp){
  if(pdnp&&R()<pdnp)return; // não jogou (descanso, corte de última hora)
  const g=()=>gauss(R);const n=(m,f)=>Math.max(0,Math.round(m+g()*f*Math.sqrt(m+.01)));
  const fga=n(av[8],FVAR.fga),pf=av[8]?av[7]/av[8]:0;
  const fgm=Math.min(fga,Math.max(0,Math.round(fga*pf+g()*Math.sqrt(fga*pf*(1-pf)+.01)*1.15)));
  const fta=n(av[10],FVAR.fta),pt=av[10]?av[9]/av[10]:.75;
  const ftm=Math.min(fta,Math.max(0,Math.round(fta*pt+g()*Math.sqrt(fta*pt*(1-pt)+.01))));
  const tp=Math.min(fgm,n(av[5],FVAR.tp));
  const pts=Math.max(0,2*fgm+tp+ftm+Math.round(g()*0.35*Math.sqrt(av[0]+.01)));
  out[0]+=pts;out[5]+=tp;out[7]+=fgm;out[8]+=fga;out[9]+=ftm;out[10]+=fta;
  out[1]+=n(av[1],FVAR.reb);out[2]+=n(av[2],FVAR.ast);out[3]+=n(av[3],FVAR.stl);out[4]+=n(av[4],FVAR.blk);out[6]+=n(av[6],FVAR.to);
}
function simula(a,b){
  const k=a+"-"+b;if(EST.sim[k])return EST.sim[k];
  const N=4000,R=rng(DADOS.cur*1009+a*131+b);
  const ta=EST.tot[a],tb=EST.tot[b],ra=EST.rem[a],rb=EST.rem[b];
  const res={},cat=Array(9).fill(0),catE=Array(9).fill(0);let V=0,E=0,L=0;
  for(let n=0;n<N;n++){
    const x=ta.slice(),y=tb.slice();ra.forEach(av=>jogoSim(av,x,R,av.dnp));rb.forEach(av=>jogoSim(av,y,R,av.dnp));
    const s=placar(x,y);s.r.forEach((r,j)=>{if(r>0)cat[j]++;else if(!r)catE[j]++});
    const key=s.w+"-"+s.l+"-"+s.t;res[key]=(res[key]||0)+1;
    if(s.w>s.l)V++;else if(s.w<s.l)L++;else E++;
  }
  Object.keys(res).forEach(k2=>res[k2]/=N);
  // calibração (backtest 23/24–25/26, semanas 1–8, 990 pontos; doc 40): com muito jogo pela frente o modelo puro é confiante demais
  // (streaming, lesão, minutos). Achata a chance conforme os jogos que faltam: T=1 até 25 jogos, caindo até 0,55.
  const nr=ra.length+rb.length,Tc=Math.max(0.55,Math.min(1,1-0.0085*(nr-25)));const cal=P=>{const q=P.map(x=>Math.pow(Math.max(x,1e-4),Tc));const sq=q.reduce((x,y)=>x+y,0);return q.map(x=>x/sq)};
  const [cpa,cpe,cpb]=cal([V/N,E/N,L/N]);
  return EST.sim[k]={pa:cpa,pe:cpe,pb:cpb,cru:[V/N,E/N,L/N],Tc,res,cat:cat.map(x=>x/N),catE:catE.map(x=>x/N)};
}

/* ---------- simulação da temporada (ranking, playoffs, título) ---------- */
const REL={"FG%":0.023,"FT%":0.038,"3PM":0.218,REB:0.182,AST:0.193,STL:0.226,BLK:0.277,TO:0.202,PTS:0.173};
function forcaSemana(id,wk){ // 10 melhores saudáveis × jogos da semana
  const gw=DADOS.gw||{};const top=(EST.rost[id]||[]).filter(p=>p.avx&&p.slot!==13&&p.inj!=="OUT").sort((x,y)=>(y.nota||0)-(x.nota||0)).slice(0,10);
  let f=zero(),g=0;top.forEach(p=>{const n=(gw[p.pro]&&gw[p.pro][wk])||3.4;g+=n;f=soma(f,p.avx.map(x=>x*n))});return {f,g};
}
function semanasFeitas(id){ // vetores das semanas fechadas, na ordem de CATS
  const out=[];(DADOS.hist||[]).forEach(h=>{const eu=h[1]===id?h[5]:h[2]===id?h[6]:null;if(!eu)return;const [pts,reb,ast,stl,blk,tp,fg,ft,to]=eu;out.push({FG:fg,FT:ft,v:[pts,reb,ast,stl,blk,tp,to]})});return out;
}
function esperado(id,wk){ // valor esperado de cada categoria numa semana futura: mistura do que o time fez com a força do elenco
  const feitas=semanasFeitas(id),n=feitas.length;const {f,g}=forcaSemana(id,wk);
  const cat=CATS.map(c=>c.f(f));
  if(!n)return cat;
  const gm=g/3.4/10; // fator de volume da semana em relação a uma semana normal
  return CATS.map((c,j)=>{let real;if(c.k==="FG%")real=feitas.reduce((s,x)=>s+x.FG,0)/n;else if(c.k==="FT%")real=feitas.reduce((s,x)=>s+x.FT,0)/n;else{const idx={PTS:0,REB:1,AST:2,STL:3,BLK:4,"3PM":5,TO:6}[c.k];real=feitas.reduce((s,x)=>s+x.v[idx],0)/n*gm}
    const w=n/(n+4);return w*real+(1-w)*cat[j]});
}
function simTemporada(){
  if(EST.temp)return EST.temp;const d=DADOS;const ids=d.teams.map(t=>t.id);const N=1200,R=rng(d.gerado%7919+17);
  // vitórias já contadas
  const base={};ids.forEach(id=>{const r=d.teams.find(t=>t.id===id).rec;base[id]={w:r[0],l:r[1],t:r[2]}});
  // semana atual: usa a simulação do confronto
  const atual=d.mt.map(m=>({m,s:simula(m[0],m[1])}));
  const fut=(d.fut||[]).filter(f=>f[0]>d.wk&&f[0]<=SEMANAS);
  // probabilidade de uma categoria numa semana futura: diferença de força com ruído
  const EXP={};const expDe=(id,w)=>{const k=id+"-"+w;if(!EXP[k])EXP[k]=esperado(id,w);return EXP[k]};
  // sd da diferença semanal por categoria, calibrada nas 4 temporadas anteriores (k=1,4 deu o melhor Brier de playoffs no backtest)
  const pCat=(a,b,w)=>{const ea=expDe(a,w),eb=expDe(b,w);return CATS.map((c,j)=>{const x=ea[j],y=eb[j];const dlt=c.inv?y-x:x-y;const sd=1.4*Math.SQRT2*(c.pct?REL[c.k]:REL[c.k]*(Math.abs(x)+Math.abs(y))/2)+0.001;return 0.5*(1+erf(dlt/sd/Math.SQRT2))})};
  const pc={};fut.forEach(([w,a,b])=>{pc[a+"-"+b]=pCat(a,b,w)});
  const cont={};ids.forEach(id=>cont[id]={po:0,s1:0,tit:0,fin:0,lant:0,w:0});
  for(let n=0;n<N;n++){
    const rec={};ids.forEach(id=>rec[id]={...base[id]});
    atual.forEach(({m,s})=>{const u=R();if(u<s.pa)rec[m[0]].w++,rec[m[1]].l++;else if(u<s.pa+s.pb)rec[m[1]].w++,rec[m[0]].l++;else rec[m[0]].t++,rec[m[1]].t++});
    fut.forEach(([w,a,b])=>{const p=pc[a+"-"+b];let x=0,y=0;p.forEach(q=>{R()<q?x++:y++});if(x>y)rec[a].w++,rec[b].l++;else if(y>x)rec[b].w++,rec[a].l++;else rec[a].t++,rec[b].t++});
    const ord=ids.slice().sort((p,q)=>(rec[q].w+rec[q].t/2)-(rec[p].w+rec[p].t/2)||R()-0.5);
    ord.slice(0,PLAYOFFS).forEach(id=>cont[id].po++);cont[ord[0]].s1++;cont[ord[ord.length-1]].lant++;
    ids.forEach(id=>cont[id].w+=rec[id].w);
    // mata-mata: 1 e 2 folgam; 3x6, 4x5; depois 1 x pior sobrevivente, 2 x outro; final
    const win=(a,b)=>{const p=pCat(a,b,SEMANAS+1);let x=0;p.forEach(q=>{if(R()<q)x++});return x>=5?a:(x===4&&R()<0.5?a:b)};
    const [s1,s2,s3,s4,s5,s6]=ord;const q1=win(s3,s6),q2=win(s4,s5);
    const lo=[q1,q2].sort((p,q)=>ord.indexOf(q)-ord.indexOf(p))[0],hi=lo===q1?q2:q1;
    const f1=win(s1,lo),f2=win(s2,hi);const ch=win(f1,f2);cont[ch].tit++;cont[f1].fin++;cont[f2].fin++;
  }
  const out={};ids.forEach(id=>out[id]={po:cont[id].po/N,s1:cont[id].s1/N,tit:cont[id].tit/N,fin:cont[id].fin/N,lant:cont[id].lant/N,w:cont[id].w/N});
  return EST.temp=out;
}
function erf(x){const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}

function rankingLoydao(ateSemana){
  const d=DADOS;const ids=d.teams.map(t=>t.id);const out={};
  const camp={};HIST.campeoes.forEach(c=>{camp[c[2]]=(camp[c[2]]||0)+(c[0]>=2026?1:c[0]===2025?0.7:c[0]===2024?0.5:0.3)});
  const hist={};HIST.tab.forEach(r=>{const h=hist[r[1]]=hist[r[1]]||{v:0,d:0,e:0,ult:null};h.v+=r[3];h.d+=r[4];h.e+=r[5];if(r[0]==="2025/26")h.ult=r[6]});
  ids.forEach(id=>{const nm=T(id)[0];let w=0,l=0,t=0,cw=0,cl=0,ult=[];
    (d.hist||[]).filter(h=>h[0]<=ateSemana&&(h[1]===id||h[2]===id)).sort((a,b)=>a[0]-b[0]).forEach(h=>{const eu=h[1]===id;const [a,b]=eu?[h[3][0],h[3][1]]:[h[3][1],h[3][0]];cw+=a;cl+=b;const r=h[4]===id?"v":h[4]?"d":"e";r==="v"?w++:r==="d"?l++:t++;ult.push(r)});
    const h=hist[nm]||{v:0,d:0,e:0,ult:null};const jh=h.v+h.d+h.e;
    const forca=(EST.rost[id]||[]).filter(p=>p.nota!=null&&p.slot!==13&&p.inj!=="OUT").sort((x,y)=>y.nota-x.nota).slice(0,10).reduce((s,p)=>s+p.nota,0);
    const mom=ult.slice(-3).reduce((s,r)=>s+(r==="v"?1:r==="d"?-1:0),0);
    const r=1000+45*(w-l)+2.5*(cw-cl)+5*forca+(h.ult?(13-h.ult)*7:0)+55*(camp[nm]||0)+(jh?(h.v+h.e/2)/jh-0.5:0)*220+12*mom;
    out[id]={r:Math.round(r),w,l,t,cw,cl,forca,ult,tit:HIST.campeoes.filter(c=>c[2]===nm).length}});
  return out;
}

function trocasAtuais(){ // 26/27: jogador em time diferente do draft sem registro de add = veio por troca
  const d=DADOS;if(!d||!d.tx||!HIST.drafts||!HIST.drafts["2026/27"])return "";
  const adds=new Set(d.tx.adds||[]);const dr={};HIST.drafts["2026/27"].forEach(r=>dr[r[3]]=r[2]);

  const achaP=id=>d.P.find(q=>q.id===id&&!q.fora)||d.P.find(q=>q.id===id)||(d.fa||[]).find(q=>q.id===id)||{id,n:(typeof BOX!=="undefined"&&BOX.meta[id]&&BOX.meta[id].n)||("jogador "+id),fora:1};
  const mov=(d.tx.tr||[]).map(([id,de,para,sp])=>{const p=achaP(id);return {p,de:T(de)[0],para:T(para)[0],sp,saiu:!d.P.some(q=>q.id===id&&!q.fora&&q.t===para)}});

  const fase=(id,tm)=>{const s2=zero();let g=0,ult=0,pri=0;if(!boxOk)return null;Object.entries(BOX.dias).forEach(([sp,L])=>L.forEach(l=>{if(l[0]===id&&l[1]===tm){ult=Math.max(ult,+sp);pri=pri?Math.min(pri,+sp):+sp;l.slice(3,14).forEach((y,i)=>s2[i]+=y);g++}}));

      out.push({sp,adv:(e.atVs==="@"?"@":"vs ")+((e.opponent||{}).abbreviation||""),res:(e.gameResult||"")+" "+(e.score||""),min:+s[0]||0,s:[+s[13]||0,+s[7]||0,+s[8]||0,+s[10]||0,+s[9]||0,tr[0]||0,+s[12]||0,fg[0]||0,fg[1]||0,ft[0]||0,ft[1]||0]})})));
    out.sort((a,b)=>b.sp-a.sp);GL[id]=out;gravarCache(ck,out)}catch(e){GL[id]=[]}
  return GL[id]}

/* alertas de lesão automáticos (sem X): relatório de lesões e notícias da ESPN, filtrados pelos jogadores da liga */
AO.alertas=(lerCache("wbs.lesAlert2")||[]);
const PARTE={ankle:"tornozelo",knee:"joelho",hamstring:"posterior da coxa",calf:"panturrilha",back:"costas",groin:"virilha",hip:"quadril",shoulder:"ombro",wrist:"punho",hand:"mão",finger:"dedo",thumb:"dedão",foot:"pé",toe:"dedo do pé",achilles:"tendão de Aquiles",concussion:"concussão",illness:"virose",head:"cabeça",eye:"olho",elbow:"cotovelo",quad:"quadríceps",rib:"costela",neck:"pescoço",nose:"nariz",face:"rosto",personal:"motivos pessoais",rest:"descanso"};
function parteDe(t){t=(t||"").toLowerCase();for(const k in PARTE)if(t.includes(k))return PARTE[k];return ""}
function classifica(t){t=(t||"").toLowerCase();
  if(/locker room|went to the locker|headed to the locker|heads to the locker/.test(t))return "vest";
  if(/won't return|will not return|ruled out for the rest|out for the rest|left the game|exited|did not return/.test(t))return "naovolta";
  if(/\bout for (the )?season|season-ending/.test(t))return "temporada";
  if(/\bruled out\b|\bwill miss\b|\bwon't play\b|\bout (monday|tuesday|wednesday|thursday|friday|saturday|sunday|tonight)\b/.test(t))return "out";
  return null}
function frasePT(tipo,parte){const p=parte?` (${parte})`:"";return tipo==="vest"?`foi pro vestiário${p}`:tipo==="naovolta"?`não volta mais pro jogo${p}`:tipo==="temporada"?`está fora da temporada${p}`:`está OUT${p}`}
async function buscarAlertasESPN(){if(!DADOS)return 0;const nomes={};DADOS.P.forEach(p=>{if(!p.fora)nomes[p.n.toLowerCase()]=p});
  const ultimo=lerCache("wbs.lesESPN2")||{};const novos=[];const agora=Date.now();
  // 1) relatório de lesões: só quem PASSOU a OUT
  try{const j=await ajson("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries");
    (j.injuries||[]).forEach(tm=>(tm.injuries||[]).forEach(x=>{const nm=((x.athlete||{}).displayName||"").toLowerCase();const p=nomes[nm];if(!p)return;
      const st=(x.status||"").toLowerCase(),cm=(x.shortComment||x.longComment||"");const dt=Date.parse(x.date||"")||0;const era=ultimo[p.n];ultimo[p.n]=st;
      if(!/^out/.test(st)||(era&&/^out/.test(era)))return;if(!dt||agora-dt>18*3600e3)return;
      const tipo=classifica(cm)||"out";novos.push({nome:p.n,txt:frasePT(tipo==="temporada"?"temporada":"out",parteDe(cm)),t:dt})}))}catch(e){}
  // 2) notícias: só vestiário / não volta / fora
  try{const j=await ajson("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news?limit=50");
    (j.articles||[]).forEach(a=>{const h=(a.headline||"")+" "+(a.description||"");const dt=Date.parse(a.published||"")||0;if(!dt||agora-dt>8*3600e3)return;
      const tipo=classifica(h);if(!tipo)return;const p=Object.values(nomes).find(q=>h.includes(q.n));if(!p)return;const key="n:"+(a.id||a.headline);if(ultimo[key])return;ultimo[key]=1;
      novos.push({nome:p.n,txt:frasePT(tipo,parteDe(h)),t:dt})})}catch(e){}
  gravarCache("wbs.lesESPN2",ultimo);
  if(novos.length){const vistos=new Set(AO.alertas.map(x=>x.nome+x.txt));novos.forEach(x=>{if(!vistos.has(x.nome+x.txt))AO.alertas.unshift(Object.assign(x,{sp:DADOS.cur}))});
    AO.alertas=AO.alertas.filter(x=>x.sp===DADOS.cur).sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,6);gravarCache("wbs.lesAlert2",AO.alertas)}
  return novos.length}
setTimeout(()=>buscarAlertasESPN().then(n=>{if(n)ticker()}),8000);
